openapi: 3.0.3
info:
  title: DFP Connect 관리자 API
  description: 장애와가족플랫폼 관리자 대시보드 API (폼 관리, 스토리 승인)
  version: 1.0.0
  contact:
    name: DFP Connect Team
    email: contact@dfp.or.kr

servers:
  - url: https://dfp-connect-{region}.run.app/api/admin
    description: Production (Cloud Run)
    variables:
      region:
        default: asia-northeast3
  - url: http://localhost:3000/api/admin
    description: Development

security:
  - clerk: []

tags:
  - name: Forms Management
    description: 폼 제출 관리
  - name: Stories Management
    description: 스토리 승인 관리
  - name: Analytics
    description: 통계 및 분석

paths:
  /forms:
    get:
      tags: [Forms Management]
      summary: 폼 제출 목록 조회
      description: 모든 폼 제출을 조회합니다 (필터링, 정렬, 페이지네이션 지원)
      operationId: getFormSubmissions
      parameters:
        - name: formType
          in: query
          schema:
            $ref: '#/components/schemas/FormType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SubmissionStatus'
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, NORMAL, HIGH, URGENT]
        - name: assignedTo
          in: query
          description: 담당자 Clerk ID
          schema:
            type: string
        - name: startDate
          in: query
          description: 제출 시작일
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 제출 종료일
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            type: string
            enum: [createdAt_desc, createdAt_asc, priority_desc]
            default: createdAt_desc
      responses:
        '200':
          description: 폼 제출 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      forms:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormSubmissionAdmin'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      summary:
                        $ref: '#/components/schemas/FormSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /forms/{id}:
    get:
      tags: [Forms Management]
      summary: 폼 제출 상세 조회
      operationId: getFormSubmissionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 폼 제출 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FormSubmissionAdmin'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Forms Management]
      summary: 폼 제출 상태 업데이트
      operationId: updateFormSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/SubmissionStatus'
                assignedTo:
                  type: string
                  nullable: true
                adminNotes:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: 업데이트 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FormSubmissionAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stories:
    get:
      tags: [Stories Management]
      summary: 스토리 관리 목록
      description: 모든 상태의 스토리를 조회합니다 (승인 대기 포함)
      operationId: getStoriesAdmin
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/StoryCategory'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 스토리 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stories:
                        type: array
                        items:
                          $ref: '#/components/schemas/StoryAdmin'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      summary:
                        $ref: '#/components/schemas/StorySummary'

  /stories/{id}:
    get:
      tags: [Stories Management]
      summary: 스토리 상세 조회
      operationId: getStoryByIdAdmin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 스토리 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StoryAdmin'

    patch:
      tags: [Stories Management]
      summary: 스토리 승인/거부
      operationId: reviewStory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject, publish, archive]
                reviewNotes:
                  type: string
                  maxLength: 1000
                featuredOrder:
                  type: integer
                  nullable: true
                  description: 추천 순서 (null이면 일반 스토리)
      responses:
        '200':
          description: 검토 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StoryAdmin'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: 대시보드 통계
      description: 관리자 대시보드 메인 화면에 표시할 핵심 지표
      operationId: getDashboardAnalytics
      responses:
        '200':
          description: 대시보드 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DashboardAnalytics'

  /analytics/forms:
    get:
      tags: [Analytics]
      summary: 폼 제출 통계
      description: 폼 제출 트렌드 및 분석
      operationId: getFormAnalytics
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        '200':
          description: 폼 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FormAnalytics'

components:
  schemas:
    FormType:
      type: string
      enum: [EMERGENCY_CARE, B2B_INQUIRY, PARTNERSHIP, SUPPORT_INQUIRY]

    SubmissionStatus:
      type: string
      enum: [PENDING, REVIEWING, CONTACTED, IN_PROGRESS, RESOLVED, CLOSED]

    ContentStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, PUBLISHED, ARCHIVED]

    StoryCategory:
      type: string
      enum: [PARENTING, DAILY_LIFE, ADVOCACY, SUCCESS]

    FormSubmissionAdmin:
      type: object
      properties:
        id:
          type: string
        formType:
          $ref: '#/components/schemas/FormType'
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
        organization:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        message:
          type: string
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        assignedTo:
          type: string
          nullable: true
        assignedToName:
          type: string
          nullable: true
          description: 담당자 이름 (조인)
        processedAt:
          type: string
          format: date-time
          nullable: true
        adminNotes:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statusHistory:
          type: array
          items:
            type: object
            properties:
              fromStatus:
                type: string
                nullable: true
              toStatus:
                type: string
              changedBy:
                type: string
                nullable: true
              changedByName:
                type: string
                nullable: true
              notes:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time

    StoryAdmin:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        category:
          $ref: '#/components/schemas/StoryCategory'
        authorName:
          type: string
          nullable: true
        isAnonymous:
          type: boolean
        userId:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        featuredImage:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        reviewedBy:
          type: string
          nullable: true
        reviewedByName:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewNotes:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        viewCount:
          type: integer
        featuredOrder:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        statusHistory:
          type: array
          items:
            type: object
            properties:
              fromStatus:
                type: string
                nullable: true
              toStatus:
                type: string
              changedBy:
                type: string
                nullable: true
              notes:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time

    FormSummary:
      type: object
      description: 폼 제출 요약 통계
      properties:
        total:
          type: integer
        byStatus:
          type: object
          properties:
            pending:
              type: integer
            reviewing:
              type: integer
            contacted:
              type: integer
            inProgress:
              type: integer
            resolved:
              type: integer
            closed:
              type: integer
        byType:
          type: object
          properties:
            emergencyCare:
              type: integer
            b2bInquiry:
              type: integer
            partnership:
              type: integer
            supportInquiry:
              type: integer
        byPriority:
          type: object
          properties:
            urgent:
              type: integer
            high:
              type: integer
            normal:
              type: integer
            low:
              type: integer

    StorySummary:
      type: object
      description: 스토리 요약 통계
      properties:
        total:
          type: integer
        byStatus:
          type: object
          properties:
            pending:
              type: integer
            approved:
              type: integer
            rejected:
              type: integer
            published:
              type: integer
            archived:
              type: integer
        byCategory:
          type: object
          properties:
            parenting:
              type: integer
            dailyLife:
              type: integer
            advocacy:
              type: integer
            success:
              type: integer

    DashboardAnalytics:
      type: object
      properties:
        forms:
          type: object
          properties:
            pendingCount:
              type: integer
              description: 대기 중인 폼 수
            urgentCount:
              type: integer
              description: 긴급 폼 수
            todayCount:
              type: integer
              description: 오늘 제출된 폼 수
            weekCount:
              type: integer
              description: 이번 주 제출된 폼 수
            averageResponseTime:
              type: number
              description: 평균 응답 시간 (시간)
        stories:
          type: object
          properties:
            pendingReview:
              type: integer
              description: 승인 대기 중인 스토리 수
            publishedThisMonth:
              type: integer
              description: 이번 달 게시된 스토리 수
            totalPublished:
              type: integer
              description: 총 게시된 스토리 수
            averageViewCount:
              type: number
              description: 평균 조회수
        recentActivity:
          type: array
          description: 최근 활동 (최대 10개)
          items:
            type: object
            properties:
              type:
                type: string
                enum: [FORM_SUBMITTED, STORY_SUBMITTED, FORM_RESOLVED, STORY_PUBLISHED]
              title:
                type: string
              timestamp:
                type: string
                format: date-time
              link:
                type: string
                description: 상세 페이지 URL

    FormAnalytics:
      type: object
      properties:
        timeSeries:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              total:
                type: integer
              byType:
                type: object
                additionalProperties:
                  type: integer
        typeDistribution:
          type: object
          additionalProperties:
            type: integer
        statusDistribution:
          type: object
          additionalProperties:
            type: integer
        averageResolutionTime:
          type: number
          description: 평균 해결 시간 (시간)
        topSources:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              count:
                type: integer

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object

  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 로그인이 필요합니다

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: 관리자 권한이 필요합니다

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    clerk:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk 세션 토큰
