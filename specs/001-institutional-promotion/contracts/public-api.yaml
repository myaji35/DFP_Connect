openapi: 3.0.3
info:
  title: DFP Connect 공개 API
  description: 장애와가족플랫폼 웹사이트의 공개 API (폼 제출, 스토리 조회)
  version: 1.0.0
  contact:
    name: DFP Connect Team
    email: contact@dfp.or.kr

servers:
  - url: https://dfp-connect-{region}.run.app/api
    description: Production (Cloud Run)
    variables:
      region:
        default: asia-northeast3
  - url: http://localhost:3000/api
    description: Development

tags:
  - name: Forms
    description: 폼 제출 관리 (긴급돌봄, B2B 문의, 파트너십, 후원)
  - name: Stories
    description: 가족 이야기/후기 조회 및 제출
  - name: Donations
    description: 후원 계좌 정보

paths:
  /forms:
    post:
      tags: [Forms]
      summary: 폼 제출
      description: 긴급돌봄, B2B 문의, 파트너십 제안, 후원 문의 폼을 제출합니다.
      operationId: submitForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormSubmissionInput'
            examples:
              emergencyCare:
                summary: 긴급돌봄 요청
                value:
                  formType: EMERGENCY_CARE
                  name: 김영희
                  phone: 010-1234-5678
                  message: 보호자가 갑자기 입원하여 오늘 당장 아이를 맡길 곳이 필요합니다.
              b2bInquiry:
                summary: B2B 문의
                value:
                  formType: B2B_INQUIRY
                  name: 박철수
                  email: park@example.com
                  phone: 02-1234-5678
                  organization: OO복지센터
                  subject: 전문인력 파견 문의
                  message: 주간보호센터에 작업치료사 파견이 가능한지 문의드립니다.
      responses:
        '201':
          description: 폼 제출 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FormSubmission'
                  message:
                    type: string
                    example: 요청이 접수되었습니다. 담당자가 곧 연락드리겠습니다.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - turnstile: []

  /stories:
    get:
      tags: [Stories]
      summary: 스토리 목록 조회
      description: 게시된 가족 이야기/후기 목록을 조회합니다 (필터링, 검색, 페이지네이션 지원)
      operationId: getStories
      parameters:
        - name: category
          in: query
          description: 카테고리 필터
          schema:
            $ref: '#/components/schemas/StoryCategory'
        - name: search
          in: query
          description: 검색어 (제목 및 본문)
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: 페이지 번호 (1부터 시작)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 페이지당 항목 수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: 스토리 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      stories:
                        type: array
                        items:
                          $ref: '#/components/schemas/StoryPublic'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Stories]
      summary: 스토리 제출
      description: 새로운 가족 이야기/후기를 제출합니다 (관리자 승인 필요)
      operationId: submitStory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorySubmissionInput'
      responses:
        '201':
          description: 스토리 제출 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        example: PENDING
                  message:
                    type: string
                    example: 사연이 제출되었습니다. 검토 후 게시됩니다.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      security:
        - turnstile: []

  /stories/{id}:
    get:
      tags: [Stories]
      summary: 스토리 상세 조회
      description: 특정 스토리의 상세 내용을 조회합니다
      operationId: getStoryById
      parameters:
        - name: id
          in: path
          required: true
          description: 스토리 ID
          schema:
            type: string
      responses:
        '200':
          description: 스토리 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StoryPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /donations/accounts:
    get:
      tags: [Donations]
      summary: 후원 계좌 정보 조회
      description: 활성화된 후원 계좌 목록을 조회합니다
      operationId: getDonationAccounts
      responses:
        '200':
          description: 후원 계좌 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DonationAccount'

components:
  schemas:
    FormType:
      type: string
      enum:
        - EMERGENCY_CARE
        - B2B_INQUIRY
        - PARTNERSHIP
        - SUPPORT_INQUIRY
      description: |
        폼 유형:
        - EMERGENCY_CARE: 긴급돌봄 요청
        - B2B_INQUIRY: B2B 문의
        - PARTNERSHIP: 파트너십 제안
        - SUPPORT_INQUIRY: 후원 문의

    SubmissionStatus:
      type: string
      enum:
        - PENDING
        - REVIEWING
        - CONTACTED
        - IN_PROGRESS
        - RESOLVED
        - CLOSED

    StoryCategory:
      type: string
      enum:
        - PARENTING
        - DAILY_LIFE
        - ADVOCACY
        - SUCCESS
      description: |
        스토리 카테고리:
        - PARENTING: 양육
        - DAILY_LIFE: 일상생활
        - ADVOCACY: 권익옹호
        - SUCCESS: 성공사례

    FormSubmissionInput:
      type: object
      required:
        - formType
        - name
        - phone
        - message
      properties:
        formType:
          $ref: '#/components/schemas/FormType'
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: 김영희
        email:
          type: string
          format: email
          maxLength: 100
          example: kim@example.com
        phone:
          type: string
          pattern: '^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$'
          example: 010-1234-5678
        organization:
          type: string
          maxLength: 100
          example: OO복지센터
        subject:
          type: string
          maxLength: 200
          example: 전문인력 파견 문의
        message:
          type: string
          minLength: 10
          maxLength: 2000
          example: 상담 내용을 입력하세요

    FormSubmission:
      allOf:
        - $ref: '#/components/schemas/FormSubmissionInput'
        - type: object
          properties:
            id:
              type: string
              example: cm1a2b3c4d5e6f7g8h9i0j1k
            status:
              $ref: '#/components/schemas/SubmissionStatus'
            priority:
              type: string
              enum: [LOW, NORMAL, HIGH, URGENT]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    StorySubmissionInput:
      type: object
      required:
        - title
        - content
        - category
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 100
          example: 우리 아이의 첫 홈티 경험
        content:
          type: string
          minLength: 50
          maxLength: 10000
          example: 방과후 홈티 서비스를 이용한 후 아이의 변화가...
        category:
          $ref: '#/components/schemas/StoryCategory'
        authorName:
          type: string
          maxLength: 50
          example: 김OO
        isAnonymous:
          type: boolean
          default: false
        email:
          type: string
          format: email
          example: parent@example.com
        phone:
          type: string
          pattern: '^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$'
          example: 010-1234-5678
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 20
          example: [홈티, 성장, 감사]

    StoryPublic:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
          description: Markdown 형식
        category:
          $ref: '#/components/schemas/StoryCategory'
        authorName:
          type: string
          nullable: true
          description: 익명일 경우 null
        isAnonymous:
          type: boolean
        featuredImage:
          type: string
          format: uri
          nullable: true
        images:
          type: array
          items:
            type: string
            format: uri
        viewCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DonationAccount:
      type: object
      properties:
        id:
          type: string
        bankName:
          type: string
          example: 신한은행
        accountNumber:
          type: string
          example: 110-123-456789
        accountHolder:
          type: string
          example: 장애와가족플랫폼 사회적협동조합
        purpose:
          type: string
          nullable: true
          example: 일반 후원

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        total:
          type: integer
          example: 47
        totalPages:
          type: integer
          example: 4

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: 입력값이 올바르지 않습니다
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 입력값이 올바르지 않습니다
              details:
                - field: phone
                  message: 올바른 전화번호를 입력하세요

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: 요청한 스토리를 찾을 수 없습니다

    RateLimitExceeded:
      description: 요청 제한 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: 너무 많은 요청이 발생했습니다. 잠시 후 다시 시도해주세요
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: 시간당 허용 요청 수
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: 남은 요청 수
        X-RateLimit-Reset:
          schema:
            type: integer
          description: 제한이 리셋되는 시각 (Unix timestamp)

    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요

  securitySchemes:
    turnstile:
      type: apiKey
      in: header
      name: X-Turnstile-Token
      description: Cloudflare Turnstile 토큰 (스팸 방지)
